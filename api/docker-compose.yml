version: "3.9"
services:
  api:
    container_name: atrio_api
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: sh -c "npm run migrate && npm run seed && npm run start:dev"
    ports:
      - 3101:3000
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development
      APP_RUNTIME: local
      PORT: 3000
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006,http://localhost:3000,http://127.0.0.1:3000
      CORS_ALLOW_CREDENTIALS: "true"
      DATABASE_HOST: atrio_postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: atrio
      DB_LOG: "false"
      REDIS_SCHEMA: redis
      REDIS_HOST: atrio_redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_TTL_MINUTES: 720
      CHALLENGE_TTL_SECONDS: 300
      CHALLENGE_RESEND_COOLDOWN_SECONDS: 60
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIRECTORY: storage
      LOCAL_STORAGE_PUBLIC_BASE_URL: http://localhost:3101/storage
      QUEUE_DRIVER: redis
      AWS_ACCESS_KEY_ENABLED: "false"
      AWS_REGION: us-east-1
      AWS_S3_REGION: us-east-1
      AWS_S3_BUCKET: atrio-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/docs >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      atrio_api_network:
        ipv4_address: 172.61.0.10
  redis:
    container_name: atrio_redis
    build:
      context: .
      dockerfile: ./docker/redis/Dockerfile
    ports:
      - 6382:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      atrio_api_network:
        ipv4_address: 172.61.0.11
  postgres:
    container_name: atrio_postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atrio
    ports:
      - 5437:5432
    volumes:
      - atrio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atrio"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      atrio_api_network:
        ipv4_address: 172.61.0.12
networks:
  atrio_api_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.61.0.0/24
          gateway: 172.61.0.1
volumes:
  atrio_postgres_data:
